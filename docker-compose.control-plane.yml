services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: founder_os
      POSTGRES_USER: founder_os_owner
      POSTGRES_PASSWORD: founder_os_owner
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U founder_os_owner -d founder_os"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - founder_os_postgres:/var/lib/postgresql/data
      - ./db/control-plane/docker-init:/docker-entrypoint-initdb.d:ro

volumes:
  founder_os_postgres:
